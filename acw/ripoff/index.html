<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripoff — Physics Playground</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #CanvasPrototype {
      display: block;
      position: fixed;
      inset: 0;
      cursor: crosshair;
    }

    #back {
      position: fixed; top: 12px; left: 14px;
      color: #adf; font: 11px/1 monospace;
      text-decoration: none; opacity: 0.5;
      transition: opacity .2s; z-index: 10;
    }
    #back:hover { opacity: 1; }
  </style>
</head>
<body>

<canvas id="CanvasPrototype"></canvas>
<a id="back" href="../../">← back</a>

<script src="ripoff_compact.js"></script>
<script>Start();</script>

</body>
</html>
