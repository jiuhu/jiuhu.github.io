<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alchemy</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06080f; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      width: 100vw; height: 100vh;
      font-family: monospace;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(60,120,200,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60,120,200,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    #back {
      position: fixed; top: 12px; left: 14px;
      color: #adf; font: 11px/1 monospace;
      text-decoration: none; opacity: 0.6;
      transition: opacity .2s; z-index: 10;
    }
    #back:hover { opacity: 1; }

    #canvas {
      display: block;
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(80,120,255,.18);
      cursor: crosshair;
      touch-action: none;
      position: relative; z-index: 1;
    }

    #controls {
      display: flex;
      gap: 10px;
      position: relative; z-index: 1;
    }

    button {
      background: rgba(12,18,35,.85);
      border: 1px solid rgba(80,140,220,.2);
      color: #7af;
      padding: 6px 18px;
      font: 13px monospace;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    button:hover  { background: rgba(20,30,55,.9); border-color: rgba(80,180,255,.5); color: #adf; }
    button:active { background: rgba(30,44,75,.9); }

    #legend {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #556;
      position: relative; z-index: 1;
    }
    .leg { display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<a id="back" href="../../">← back</a>

<canvas id="canvas"></canvas>

<div id="controls">
  <button id="btn-new">new game</button>
</div>

<div id="legend">
  <div class="leg"><div class="dot" style="background:#4A90D9"></div>water</div>
  <div class="leg"><div class="dot" style="background:#E84030"></div>fire</div>
  <div class="leg"><div class="dot" style="background:#5CA84A"></div>earth</div>
  <div class="leg"><div class="dot" style="background:#B0C8E8"></div>air</div>
  <div class="leg"><div class="dot" style="background:#F0C020"></div>sun</div>
</div>

<script src="js/alchemy.js"></script>
</body>
</html>
