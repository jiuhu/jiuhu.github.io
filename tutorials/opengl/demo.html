<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora — Demo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #cde;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: rgba(6, 8, 15, 0.92);
      border-bottom: 1px solid rgba(80,140,220,.12);
      flex-shrink: 0;
    }

    #back {
      color: #adf;
      font: 11px/1 monospace;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity .2s;
      white-space: nowrap;
    }
    #back:hover { opacity: 1; }

    #demo-title {
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #7af;
      flex: 1;
    }

    #controls-hint {
      font-size: 1rem;
      color: #89a;
      white-space: nowrap;
    }

    #game-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    canvas:focus { outline: none; }
  </style>
</head>
<body>

<div id="bar">
  <a id="back" href="index.html">← back</a>
  <span id="demo-title"></span>
  <span id="controls-hint"></span>
</div>

<div id="game-wrap"></div>

<script>
const DEMOS = {
  Triangle:       { canvas: 'cvsTriangle',       title: '01 — Triangle',           controls: 'Static' },
  VertexArray:    { canvas: 'cvsVertexArray',     title: '10 — Vertex Array',       controls: 'Vertex colours via VBO' },
  Transformation: { canvas: 'cvsTransformation',  title: '02 — Transformation',     controls: '← → ↑ ↓ translate · A / S rotate' },
  Projection:     { canvas: 'cvsProjection',      title: '03 — Projection',         controls: '← → ↑ ↓ translate · PgUp / PgDn Z · A / S rotate' },
  Cube:           { canvas: 'cvsCube',             title: '04 — Cube',               controls: '← → ↑ ↓ PgUp/PgDn translate · A / D / W / S rotate' },
  Quadric:        { canvas: 'cvsQuadric',          title: '05 — Quadric',            controls: 'T = shape · M = wireframe · A / D / W / S rotate' },
  Lighting:       { canvas: 'cvsLighting',         title: '06 — Lighting',           controls: 'T = shape · IJKL/UO light · WASD rotate' },
  LightingAdv:    { canvas: 'cvsLightingAdv',      title: '06 — Lighting Advanced',  controls: 'Spotlight + ambient · WASD rotate · , / . cutoff' },
  Texture:        { canvas: 'cvsTexture',          title: '07 — Texture',            controls: 'Textured quad (procedural)' },
  TextureBlend:   { canvas: 'cvsTextureBlend',     title: '07 — Texture Blend',      controls: 'B = blend · T = shape · WASD rotate' },
  Shadow:         { canvas: 'cvsShadow',           title: '08 — Shadow',             controls: '← → move light · S = stencil' },
  ShadowAdv:      { canvas: 'cvsShadowAdv',        title: '08 — Shadow Advanced',    controls: '← → rotate sphere in box' },
  Font:           { canvas: 'cvsFont',             title: '09 — Font',               controls: 'Canvas 2D text overlay on WebGL scene' },
};

const params = new URLSearchParams(location.search);
const key = params.get('s');
const demo = DEMOS[key];

if (!demo) {
  document.body.innerHTML = '<p style="padding:32px;color:#f88">Unknown demo: ' + key + '</p>';
} else {
  document.title = 'Sora — ' + demo.title;
  document.getElementById('demo-title').textContent = demo.title;
  document.getElementById('controls-hint').textContent = demo.controls;

  const wrap = document.getElementById('game-wrap');
  const canvas = document.createElement('canvas');
  canvas.id = demo.canvas;
  canvas.tabIndex = 0;
  wrap.appendChild(canvas);

  function resizeCanvas() {
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function loadScript(src, cb) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = () => console.error('Failed to load', src);
    document.head.appendChild(s);
  }

  loadScript('js/common.js', () => {
    loadScript('js/' + key + '.js', () => {
      canvas.focus();
    });
  });
}
</script>

</body>
</html>
